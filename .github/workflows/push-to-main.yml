name: production pipeline

on:
  push:
    branches: ["main"]

jobs:

  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      # extract the version number from the cabal file
      - name: extract version number
        id: extract_version
        run: |
          version=$(grep -E '^version:' *.cabal | awk '{print $2}')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:${{ env.VERSION }}
            ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:latest
          cache-from: type=gha,scope=hackage-doc-mcp
          cache-to: type=gha,mode=max,scope=hackage-doc-mcp


