name: production pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-binaries-and-image:
    name: Build & Push (${{ matrix.arch-tag }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm 
            arch-tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build binary for ${{ matrix.platform }}
        uses: freckle/stack-action@v5
        with:
          cache-prefix: shared-
          stack-build-arguments: --copy-bins --local-bin-path ./release --ghc-options='-O2'

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: extract version number
        id: extract_version
        run: |
          version=$(grep -E '^version:' *.cabal | awk '{print $2}')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: hackage-doc-mcp:${{ env.VERSION }}-${{ matrix.arch-tag }}
          cache-from: type=gha,scope=hackage-doc-mcp
          cache-to: type=gha,mode=max,scope=hackage-doc-mcp

  create-unified-manifest:
    needs: build-binaries-and-image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: extract version number
        run: |
          version=$(grep -E '^version:' *.cabal | awk '{print $2}')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push docker manifest
        run: |
          docker buildx imagetools create \
            -t hackage-doc-mcp:${{ env.VERSION }} \
            -t hackage-doc-mcp:latest \
            hackage-doc-mcp:${{ env.VERSION }}-amd64 \
            hackage-doc-mcp:${{ env.VERSION }}-arm64
