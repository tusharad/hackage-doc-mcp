name: production pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-binaries:
    name: Build platform-specific binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build binary in container for ${{ matrix.platform }}
        id: build
        run: |
          mkdir -p release
          arch="${{ matrix.platform }}"
          docker run --rm --platform "$arch" -v "$GITHUB_WORKSPACE":/src -w /src haskell:9-stack bash -lc "stack setup && stack build --copy-bins --local-bin-path ./release --ghc-options='-O2'"
          safe_arch="${arch//\//_}"
          mv release/hackage-doc-mcp-exe release/hackage-doc-mcp-exe-${safe_arch}
          echo "safe_arch=${safe_arch}" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackage-doc-mcp-exe-${{ steps.build.outputs.safe_arch }}
          path: release/hackage-doc-mcp-exe-${{ steps.build.outputs.safe_arch }}

  build-image:
    name: Build and push docker image (uses prebuilt binaries)
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: set up qemu
        uses: docker/setup-qemu-action@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      # extract the version number from the cabal file
      - name: extract version number
        id: extract_version
        run: |
          version=$(grep -E '^version:' *.cabal | awk '{print $2}')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:${{ env.VERSION }}
            ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:latest
          cache-from: type=gha,scope=hackage-doc-mcp
          cache-to: type=gha,mode=max,scope=hackage-doc-mcp

