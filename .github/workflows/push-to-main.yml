name: production pipeline

on:
  push:
    branches: ["main"]

jobs:
    
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # extract the version number from the cabal file
      - name: extract version number
        id: extract_version
        run: |
          version=$(grep -E '^version:' *.cabal | awk '{print $2}')
          echo "VERSION=$version" >> $GITHUB_ENV
      
      - name: build docker image
        run: docker build -t {{vars.DOCKER_USERNAME}}/hackage-doc-mcp:${{ env.VERSION }} .
      
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: push docker image
        run: | 
          docker push ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:${{ env.VERSION }}
          docker tag ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:${{ env.VERSION }} ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:latest
          docker push ${{ vars.DOCKER_USERNAME }}/hackage-doc-mcp:latest


