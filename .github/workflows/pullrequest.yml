name: Validation pipeline

on:
  pull_request:
    branches: ["develop", "main"]

jobs:

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/run-fourmolu@v11
        with:
          version: "0.17.0.0"
    
  test:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v6
      - uses: freckle/stack-action@v5
